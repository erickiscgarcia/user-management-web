<div class="container mt-5">
    <h2 class="text-center mb-4">Registered users</h2>

    <div class="text-right mb-3">
        <a routerLink="/registry" class="btn btn-outline-secondary">Add User</a>
    </div>

    <div *ngIf="loading">Loading users...</div>
    <div *ngIf="errorMessage" class="error-box text-center">
        {{ errorMessage }}
    </div>

    <table class="table table-bordered table-striped mt-3" *ngIf="users.length">
        <thead>
            <tr>
                <th>First name</th>
                <th>Last name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let user of users">
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <button class="btn btn-danger btn-sm" (click)="deleteUser(user.id)">Delete</button>
                    <button class="btn btn-primary btn-sm ml-2" (click)="editUser(user)">Update</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
