<div class="d-flex justify-content-center mt-5">
    <div class="card shadow registry-container w-100" style="max-width: 700px;">
        <div class="card-body">
            <h4 class="card-title text-center mb-4">User Registration</h4>

            <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label>First Name:</label>
                    <input formControlName="firstName" type="text" class="form-control" />
                    <small *ngIf="userForm.get('firstName')?.touched && userForm.get('firstName')?.invalid"
                        class="text-danger">
                        Required field (max 50 characters)
                    </small>
                </div>

                <div class="form-group">
                    <label>Last Name:</label>
                    <input formControlName="lastName" type="text" class="form-control" />
                    <small *ngIf="userForm.get('lastName')?.touched && userForm.get('lastName')?.invalid"
                        class="text-danger">
                        Required field (max 50 characters)
                    </small>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input formControlName="email" type="email" class="form-control" />
                    <small *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid" class="text-danger">
                        Enter a valid email (max 50 characters)
                    </small>
                </div>

                <div *ngIf="errorMessage" class="error-box text-center">
                    {{ errorMessage }}
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-3" [disabled]="userForm.invalid">
                    Submit
                </button>
            </form>

            <div class="text-center mt-4">
                <a routerLink="/users" class="btn btn-outline-secondary">View registered users</a>
            </div>
        </div>
    </div>
</div>
