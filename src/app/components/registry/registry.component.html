<div class="registry-container">
    <h2>User Registration</h2>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div>
            <label>First name:</label>
            <input formControlName="firstName" type="text" />
            <small *ngIf="userForm.get('firstName')?.touched && userForm.get('firstName')?.invalid">
                Required field (max 50 characters)
            </small>
        </div>

        <div>
            <label>Last name:</label>
            <input formControlName="lastName" type="text" />
            <small *ngIf="userForm.get('lastName')?.touched && userForm.get('lastName')?.invalid">
                Required field (maximum 50 characters)
            </small>
        </div>

        <div>
            <label>Email:</label>
            <input formControlName="email" type="email" />
            <small *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
                Enter a valid email address (maximum 50 characters)
            </small>
        </div>

        <div *ngIf="serverErrorMessage" class="error-box">
            {{ serverErrorMessage }}
        </div>

        <button type="submit" [disabled]="userForm.invalid">Register</button>
    </form>
</div>
